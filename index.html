<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIO PIZZA Vincendo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 4px solid #e11d48; color: #e11d48; font-weight: 900; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 pb-40 font-sans text-gray-900">

    <header class="bg-white sticky top-0 z-50 shadow-md">
        <div class="p-4 text-center border-b">
            <h1 id="shop-name" class="text-xl font-black italic tracking-tighter uppercase"></h1>
            <p id="accroche" class="text-[10px] text-gray-500 font-bold uppercase tracking-wide mt-1"></p>
        </div>
        
        <div class="bg-green-600 p-2 text-white text-center shadow-inner">
            <p id="offre-speciale" class="text-sm font-black italic"></p>
        </div>

        <div class="bg-gray-800 text-white flex justify-around p-2 text-[9px] font-bold uppercase tracking-tight">
            <div id="horaires" class="flex items-center gap-1">🕒 <span></span></div>
            <div id="zone" class="flex items-center gap-1">📍 <span></span></div>
        </div>

        <nav id="cat-nav" class="flex overflow-x-auto p-3 space-x-6 bg-white border-b hide-scrollbar"></nav>
    </header>

    <main id="menu-container" class="p-4 space-y-6 max-w-md mx-auto min-h-[400px]"></main>

    <section class="p-4 max-w-md mx-auto">
        <h2 class="text-xs font-bold text-gray-400 uppercase mb-3 text-center tracking-widest">Extras & Suppléments</h2>
        <div id="extras-container" class="bg-white rounded-2xl p-4 shadow-sm space-y-4"></div>
    </section>

    <footer class="p-8 text-center text-gray-400 text-[10px] italic leading-relaxed max-w-md mx-auto">
        * Offre valable sur les pizzas de même taille achetées simultanément. La pizza offerte est une Margharita de taille équivalente. 
        Sauf pour la livraison d'une seule pizza. Livraison gratuite sur zone définie.
    </footer>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/95 border-t z-50 shadow-2xl">
        <a id="call-btn" href="#" class="bg-[#e11d48] text-white w-full py-4 rounded-2xl font-black flex items-center justify-center gap-3 shadow-lg active:scale-95 transition-all uppercase text-sm">
            📞 COMMANDER : <span id="tel-display"></span>
        </a>
    </div>

    <script>
        let db = { produits: [], categories: [], extras: [] };

        fetch('menu.json?v=' + Date.now())
            .then(r => r.json())
            .then(data => {
                db = data;
                const cfg = data.config;
                document.getElementById('shop-name').innerText = cfg.nom_boutique;
                document.getElementById('accroche').innerText = cfg.accroche;
                document.getElementById('offre-speciale').innerText = cfg.offre_speciale;
                document.querySelector('#horaires span').innerText = cfg.horaires;
                document.querySelector('#zone span').innerText = cfg.zone;
                document.getElementById('call-btn').href = "tel:" + cfg.telephone;
                document.getElementById('tel-display').innerText = cfg.telephone;
                
                const nav = document.getElementById('cat-nav');
                data.categories.forEach((c, i) => {
                    const b = document.createElement('button');
                    b.id = 'btn-' + c.id;
                    b.className = "whitespace-nowrap pb-1 text-xs text-gray-400 uppercase font-bold";
                    b.innerHTML = c.emoji + " " + c.nom;
                    b.onclick = () => show(c.id);
                    nav.appendChild(b);
                    if(i === 0) show(c.id);
                });

                const exC = document.getElementById('extras-container');
                data.extras.forEach(e => {
                    let pContent = "";
                    if (Array.isArray(e.prix)) {
                        pContent = `<div class="grid grid-cols-4 gap-2 mt-2">` + 
                            e.prix.map((v, idx) => `<div class="text-center bg-gray-50 rounded p-1.5"><span class="text-[8px] block text-gray-400 font-extrabold uppercase">${['Min','P','M','G'][idx]}</span><span class="text-[11px] font-black text-green-700">${v}€</span></div>`).join('') + 
                            `</div>`;
                    } else {
                        pContent = `<span class="text-green-600 font-black">${e.prix}</span>`;
                    }
                    exC.innerHTML += `<div class="pb-3 border-b last:border-0"><div class="flex justify-between text-[11px] font-bold text-gray-700 uppercase"><span>${e.nom}</span>${!Array.isArray(e.prix) ? pContent : ''}</div>${Array.isArray(e.prix) ? pContent : ''}</div>`;
                });
            });

        function show(catId) {
            db.categories.forEach(c => {
                const btn = document.getElementById('btn-' + c.id);
                if(btn) btn.className = (c.id === catId) ? "whitespace-nowrap pb-1 text-xs tab-active uppercase" : "whitespace-nowrap pb-1 text-xs text-gray-400 uppercase font-bold";
            });

            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            const list = db.produits.filter(p => p.categorie === catId);
            list.forEach(p => {
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 animate-in fade-in duration-300">
                        <h3 class="font-black text-gray-800 uppercase text-[15px] mb-1.5 tracking-tight">${p.nom}</h3>
                        <p class="text-gray-500 text-[12px] mb-5 italic leading-relaxed font-medium">${p.description}</p>
                        <div class="grid grid-cols-4 gap-2.5">
                            ${p.prix.map((v, i) => `
                                <div class="text-center bg-gray-50 p-1.5 rounded-lg border ${v === '-' ? 'opacity-20' : 'border-gray-100'}">
                                    <span class="block text-[10px] text-gray-400 uppercase font-black mb-0.5">${['Min','P','M','G'][i]}</span>
                                    <span class="text-[13px] font-black ${v === '-' ? 'text-gray-300' : 'text-red-600'}">${v}${v !== '-' ? '€' : ''}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
